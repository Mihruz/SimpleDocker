version: '3'
services:
  fcgi-server:
    build: ./fcgi-server
    container_name: fcgi-server
    networks:
      - mynetwork
    ports:
      - "8080:8080"

  nginx_proxy:
    build: ./nginx_proxy
    container_name: nginx_proxy
    ports:
      - "80:8080"
#volumes:
 #     - ./nginx_proxy/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - mynetwork
    depends_on:
      - fcgi-server

networks:
  mynetwork:  # Создаем собственную сеть
    driver: bridge